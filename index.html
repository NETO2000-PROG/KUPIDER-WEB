  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ==========================================
    // 1. INICIALIZAR SUPABASE (LLAVES CONFIGURADAS)
    // ==========================================
    const { createClient } = supabase;
    const supabaseUrl = 'https://wtvxtlogatwnoixvbszq.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0dnh0bG9nYXR3bm9peHZic3pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzkyMjIsImV4cCI6MjEwMDg1NTIyMn0.bIDNsuzz7usqHUmrUYAcnOvgE3FLytSje-5CiedJ7iI'; 
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    let mockProfiles = [];
    let currentProfileIndex = 0;
    let currentUser = null;

    // Perfiles predeterminados para que no esté vacío el feed
    const defaultProfiles = [
      { name: "Mariana Fuentes", age: 21, location: "San Nicolás / UANL", hobbies: ["Videojuegos", "Cine"], photo: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500" },
      { name: "Diego Garza", age: 22, location: "Monterrey / Tec", hobbies: ["Gimnasio", "Autos"], photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500" }
    ];

    window.onload = () => {
      checkUserSession();
      cargarPerfilesReales();
    };

    // ==========================================
    // 2. LÓGICA DE BASE DE DATOS (SUPABASE)
    // ==========================================
    async function cargarPerfilesReales() {
      const { data: perfilesReales, error } = await supabaseClient
        .from('perfiles')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error cargando perfiles:", error);
        mockProfiles = [...defaultProfiles];
      } else {
        // Formatear los datos de Supabase para la interfaz
        const perfilesFormateados = perfilesReales.map(p => ({
          name: p.nombre,
          age: p.edad,
          location: p.ubicacion,
          hobbies: p.hobbies ? p.hobbies.split(', ') : [],
          photo: p.foto
        }));
        mockProfiles = [...perfilesFormateados, ...defaultProfiles];
      }
    }

    async function guardarPerfilEnSupabase(perfil, successMsg) {
      const { data, error } = await supabaseClient
        .from('perfiles')
        .insert([
          { 
            nombre: perfil.name, 
            edad: parseInt(perfil.age), 
            ubicacion: perfil.location, 
            hobbies: perfil.hobbies.join(', '), 
            foto: perfil.photo 
          }
        ]);

      if (error) {
        console.error("Error al guardar:", error);
        alert("Hubo un error al registrar en la base de datos. Intenta de nuevo.");
      } else {
        alert(successMsg);
        cargarPerfilesReales();
        closeAuthModal();
        enterApp(); 
      }
    }

    // ==========================================
    // 3. LÓGICA DE INTERFAZ Y MODALES (UI)
    // ==========================================
    function enterApp() {
      const welcome = document.getElementById('welcome-screen');
      const app = document.getElementById('main-app');
      if (welcome) {
        welcome.style.opacity = '0';
        setTimeout(() => {
          welcome.classList.add('hidden');
          app.classList.remove('hidden');
          app.classList.add('flex');
        }, 700);
      }
    }

    function showAuthModal(tab) {
      document.getElementById('auth-modal').classList.remove('hidden');
      switchModalTab(tab);
    }

    function switchModalTab(tab) {
      document.getElementById('auth-login-container').classList.toggle('hidden', tab !== 'login');
      document.getElementById('auth-register-container').classList.toggle('hidden', tab !== 'register');
      document.getElementById('auth-cupid-container').classList.toggle('hidden', tab !== 'cupid');
      
      // Estilos visuales de las pestañas
      document.getElementById('tab-modal-login').className = tab === 'login' ? 'text-xs font-bold text-white border-b-2 border-blue-500 pb-1' : 'text-xs font-bold text-zinc-400 hover:text-white pb-1';
      document.getElementById('tab-modal-reg').className = tab === 'register' ? 'text-xs font-bold text-white border-b-2 border-pink-500 pb-1' : 'text-xs font-bold text-zinc-400 hover:text-white pb-1';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }

    // ==========================================
    // 4. LÓGICA DE REGISTRO / LOGIN
    // ==========================================
    function handleRegister(e) {
      e.preventDefault();
      
      const name = document.getElementById('reg-name').value;
      const age = document.getElementById('reg-age').value;
      const location = document.getElementById('reg-location').value || 'UANL / Mty';
      const hobbies = Array.from(document.querySelectorAll('.reg-hobby:checked')).map(cb => cb.value);
      const photoInput = document.getElementById('reg-photo');

      const defaultAvatar = "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500";

      const processPersonalProfile = (photoUrl) => {
        const newProfile = { name, age, location, hobbies, photo: photoUrl };
        currentUser = newProfile;
        try { localStorage.setItem('kupider_user', JSON.stringify(currentUser)); } catch(e){}
        guardarPerfilEnSupabase(newProfile, `¡Perfil creado con éxito! Bienvenido/a a Kupider, ${name}.`);
      };

      if (photoInput && photoInput.files && photoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          let photo = evt.target.result.length > 1000000 ? defaultAvatar : evt.target.result;
          processPersonalProfile(photo);
        };
        reader.readAsDataURL(photoInput.files[0]);
      } else {
        processPersonalProfile(defaultAvatar);
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const emailInput = document.getElementById('login-email');
      const email = emailInput ? emailInput.value : "Usuario";
      currentUser = { name: email.split('@')[0] || "Usuario Kupider" };
      try { localStorage.setItem('kupider_user', JSON.stringify(currentUser)); } catch(e) {}
      checkUserSession();
      closeAuthModal();
      alert(`¡Sesión Iniciada como ${currentUser.name}!`);
      enterApp();
    }

    function handleCupidRegister(e) {
      e.preventDefault();
      alert("¡Recomendación de Cupido guardada con éxito!");
      closeAuthModal();
    }

    function checkUserSession() {
      try { currentUser = JSON.parse(localStorage.getItem('kupider_user')); } catch(e) { currentUser = null; }
    }

    // ==========================================
    // 5. LÓGICA VISUAL MODO KUPIDO (SWIPE)
    // ==========================================
    function makeMatch(side) {
      const card = document.getElementById(`card-${side}`);
      const overlay = document.getElementById('match-overlay');
      
      if (side === 'left') {
        card.classList.add('slide-to-center-left');
      } else {
        card.classList.add('slide-to-center-right');
      }

      setTimeout(() => {
        overlay.classList.remove('opacity-0');
        overlay.classList.add('opacity-100');
      }, 200);

      setTimeout(() => {
        overlay.classList.add('opacity-0');
        overlay.classList.remove('opacity-100');
        card.classList.remove('slide-to-center-left', 'slide-to-center-right');
        card.style.opacity = '0';
        setTimeout(() => { card.style.opacity = '1'; }, 150);
      }, 1500);
    }
    
    // ==========================================
    // 6. EVENTOS DE BOTONES AUTOMÁTICOS
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Conectar botones de la pantalla principal buscando por su texto
      const welcomeButtons = document.querySelectorAll("#welcome-screen button");
      welcomeButtons.forEach(btn => {
        const text = btn.innerText.toLowerCase();
        if(text.includes("crear") || text.includes("cuenta") || text.includes("registro")) {
          btn.onclick = (e) => { e.preventDefault(); showAuthModal('register'); };
        }
        if(text.includes("iniciar") || text.includes("sesión") || text.includes("sesion") || text.includes("entrar")) {
          btn.onclick = (e) => { e.preventDefault(); showAuthModal('login'); };
        }
      });

      // 2. Conectar los botones de enviar adentro de los modales
      const modalRegBtn = document.querySelector("#auth-register-container button");
      if(modalRegBtn) {
        modalRegBtn.onclick = handleRegister;
      }

      const modalLoginBtn = document.querySelector("#auth-login-container button");
      if(modalLoginBtn) {
        modalLoginBtn.onclick = handleLogin;
      }
    });
  </script>
